# Dependabot opens pull requests for newer npm packages and GitHub Actions once a
# month, grouped so one PR covers a batch (Actions minutes are limited), and a
# security PR as soon as an advisory has a fix. Each package PR runs the Tests
# and Security audit workflows, as any other PR does; don't merge one that is red.
#
# Not covered here: the Supabase CLI `version:` pins in the workflows are inputs,
# not packages, so Dependabot can't see them. Keep bumping those by hand (see
# "Supabase CLI version" in AGENTS.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Expo pins these to each SDK release. They move together on an SDK upgrade
      # with `npx expo install --fix`, never one at a time, or the app stops
      # matching its SDK (`npx expo-doctor` fails and native builds can break).
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-test-renderer"
      - dependency-name: "react-native"
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "eslint-config-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native-*/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # These majors broke main in October 2026 (PRs #187-#189) and were rolled
      # back. Move them on purpose, in a PR that does the work, not by Dependabot:
      # - ESLint 10 and TypeScript 7 crash `expo lint`: the plugins in
      #   eslint-config-expo (eslint-plugin-react, typescript-eslint) don't
      #   support them yet. Lift these when eslint-config-expo does.
      # - React Native Testing Library 14 makes render, renderHook and fireEvent
      #   async, so every screen and hook test has to be rewritten to await them.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/react-native"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
