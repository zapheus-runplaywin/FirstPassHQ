# Dependabot opens pull requests for newer npm packages and GitHub Actions every
# week, grouped so one PR covers a batch, and a security PR as soon as an
# advisory has a fix. It ran monthly until 28 November 2026 to save Actions
# minutes; every repo is public since 22 November, so minutes are free and a
# month was too long to wait (Matt). Security PRs only come when Dependabot
# alerts and Dependabot security updates are on in the repository's settings
# (Settings > Advanced Security); this file can't turn those on.
# Each package PR runs the Tests and Security audit workflows, as any other PR
# does; don't merge one that is red. scripts/test-dependabot-config.py keeps this
# file weekly or sooner, with the security group.
#
# Not covered here: the Supabase CLI `version:` pins in the workflows are inputs,
# not packages, so Dependabot can't see them. Keep bumping those by hand (see
# "Supabase CLI version" in AGENTS.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Perth
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Expo pins these to each SDK release. They move together on an SDK upgrade
      # with `npx expo install --fix`, never one at a time, or the app stops
      # matching its SDK (`npx expo-doctor` fails and native builds can break).
      - dependency-name: "react"
      - dependency-name: "react-dom"
      # test-renderer's 1.x line follows React's minor version (1.3 for React 19.3).
      - dependency-name: "test-renderer"
        update-types: ["version-update:semver-minor"]
      # Expo pins TypeScript too (~6.0.3 for SDK 58). TypeScript 7 has no
      # JavaScript API, so typescript-eslint and `npx expo lint` stop working.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native"
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "eslint-config-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native-*/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # ESLint 10 broke main in October 2026 (#189) and was rolled back: the
      # plugins in eslint-config-expo (eslint-plugin-react) don't support it.
      # Lift this when eslint-config-expo does.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Perth
    groups:
      actions:
        patterns: ["*"]
