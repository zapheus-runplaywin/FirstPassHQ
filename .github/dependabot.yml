# Dependabot opens pull requests for newer npm packages and GitHub Actions once a
# month, grouped so one PR covers a batch (Actions minutes are limited), and a
# security PR as soon as an advisory has a fix. Each package PR runs the
# Security audit workflow; run lint, typecheck, `npm test` and the SQL tests on
# it before merging, as for any other PR (the Tests workflow is manual until
# 1 November 2026).
#
# Not covered here: the Supabase CLI `version:` pins in the workflows are inputs,
# not packages, so Dependabot can't see them. Keep bumping those by hand (see
# "Supabase CLI version" in AGENTS.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Expo pins these to each SDK release. They move together on an SDK upgrade
      # with `npx expo install --fix`, never one at a time, or the app stops
      # matching its SDK (`npx expo-doctor` fails and native builds can break).
      - dependency-name: "react"
      - dependency-name: "react-dom"
      # test-renderer's 1.x line follows React's minor version (1.3 for React 19.3).
      - dependency-name: "test-renderer"
        update-types: ["version-update:semver-minor"]
      # Expo pins TypeScript too (~6.0.3 for SDK 58). TypeScript 7 has no
      # JavaScript API, so typescript-eslint and `npx expo lint` stop working.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native"
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "eslint-config-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native-*/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
