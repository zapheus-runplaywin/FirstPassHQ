name: Browser tests

# The browser smoke tests of the web build (e2e/), on every pull request that
# can change what the web build does. Pull requests that change only the
# database, scripts or docs skip it, to save Actions minutes (Matt, 20 November
# 2026): those can't change the web build, and the Tests workflow still runs
# lint, typecheck, Jest and the database tests on them. Anything not listed
# below (src/, e2e/, assets/, package files, app config, this file) runs it.
# scripts/test-workflow-triggers.py checks the list. To run it on every pull
# request again, remove paths-ignore.
on:
  pull_request:
    paths-ignore:
      - 'supabase/**'
      - 'scripts/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The real web build driven through key flows in Chromium at phone size, with
  # Supabase answered by e2e/support/fake-supabase.ts, so a broken build or a
  # broken key flow fails here. See docs/testing-strategy.md.
  browser:
    name: browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --no-audit --no-fund
      - name: Lint the smoke tests
        env:
          EXPO_OFFLINE: '1'
        run: npx expo lint e2e
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the web app
        run: npm run e2e:build
      - name: Browser smoke tests
        run: npm run e2e
      - name: Keep the browser test report
        # The HTML report, with a screenshot and trace of each failed test.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
          if-no-files-found: ignore
