name: Purge expired injury records

# The purge-expired-injuries function removes records past the club's keep
# periods once an admin switches on "Remove old records" in Club settings:
# injuries of athletes who left (the Cleared injuries period, counted from
# when they left), the files of cleared injuries, and other records.
# This deploys the function when it changes and runs it every day.
#
# GitHub pauses scheduled workflows in a repository with no activity for 60
# days. If that happens, re-enable it under Actions.
on:
  push:
    branches: [main]
    paths: ['supabase/functions/purge-expired-injuries/**', '.github/workflows/purge-expired-injuries.yml']
  schedule:
    - cron: '17 16 * * *' # 2:17 am in Perth
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.121.0
      # No JWT check (the workflow has no member's sign-in); the function
      # checks the PURGE_SECRET function secret sent below instead.
      - run: >
          supabase functions deploy purge-expired-injuries
          --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}


  # The same function in the test project, when there is one (see
  # docs/environments.md).
  deploy-test:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check the test project is set up
        id: test
        env:
          TEST_PROJECT_ID: ${{ secrets.SUPABASE_TEST_PROJECT_ID }}
        run: echo "ready=$([ -n "$TEST_PROJECT_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.test.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.test.outputs.ready == 'true'
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.121.0
      - if: steps.test.outputs.ready == 'true'
        run: >
          supabase functions deploy purge-expired-injuries
          --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_TEST_PROJECT_ID }}

  # The extra test clubs in the development setup, when they exist (see
  # docs/environments.md). Off for now: they only run when the TEST_CLUBS
  # repository variable lists them, such as [2, 3].
  deploy-test-clubs:
    if: ${{ vars.TEST_CLUBS != '' && github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The fallback is never used: without TEST_CLUBS the job is skipped.
        club: ${{ fromJSON(vars.TEST_CLUBS || '["off"]') }}
    name: deploy-test-club-${{ matrix.club }}
    steps:
      - name: Check test club ${{ matrix.club }} is set up
        id: test
        env:
          CLUB_PROJECT_ID: ${{ secrets[format('SUPABASE_TEST_{0}_PROJECT_ID', matrix.club)] }}
        run: echo "ready=$([ -n "$CLUB_PROJECT_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.test.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.test.outputs.ready == 'true'
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.121.0
      - if: steps.test.outputs.ready == 'true'
        run: >
          supabase functions deploy purge-expired-injuries
          --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets[format('SUPABASE_TEST_{0}_ACCESS_TOKEN', matrix.club)] }}
          SUPABASE_PROJECT_ID: ${{ secrets[format('SUPABASE_TEST_{0}_PROJECT_ID', matrix.club)] }}

  purge:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result != 'failure' && github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    environment: production
    steps:
      # PURGE_SECRET is the same value set on the function with
      # `supabase secrets set PURGE_SECRET=...` (docs/environments.md).
      - run: >
          curl --fail-with-body --silent --show-error --max-time 120 -X POST
          -H "x-purge-key: $PURGE_SECRET"
          "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/purge-expired-injuries"
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          PURGE_SECRET: ${{ secrets.PURGE_SECRET }}
