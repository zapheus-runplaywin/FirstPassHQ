name: Tests

# Runs the regression suite on every push to every branch, so a branch shows a
# failure before its pull request is merged: lint, typecheck and the Jest unit
# tests for the app, the database tests in supabase/tests against every
# migration, and browser smoke tests of the web build (e2e/). Every pull
# request adds tests for what it changes (AGENTS.md "Tests").
#
# From 20 to 22 November 2026 this ran on pull requests only, to save Actions
# minutes. Every FirstPass repo is public since 22 November, so minutes are free
# and it runs on every push again (Matt). scripts/test-workflow-triggers.py
# keeps it that way.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --no-audit --no-fund
      # The checks below run even when an earlier one fails, so one run shows
      # every problem.
      - name: Lint
        env:
          EXPO_OFFLINE: '1'
        run: npx expo lint
      - name: Typecheck
        if: ${{ !cancelled() }}
        # expo start writes this file, which is not committed.
        run: |
          echo '/// <reference types="expo/types" />' > expo-env.d.ts
          npx tsc --noEmit
      - name: Unit tests
        if: ${{ !cancelled() }}
        # The runner has 2 cores, so Jest would run every file in one process
        # and run out of memory. Two workers, each replaced once it holds over
        # 1GB (workerIdleMemoryLimit in package.json), fit in about 3 minutes.
        run: npx jest --ci --coverage --maxWorkers=2
      # The edge functions run on Deno, which tsc doesn't check.
      - name: Typecheck the edge functions
        if: ${{ !cancelled() }}
        run: >
          npx -y deno@2.5.6 check
          supabase/functions/purge-expired-injuries/index.ts supabase/functions/playhq/index.ts
          supabase/functions/revoke-apple/index.ts supabase/functions/game-stats/index.ts

  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Database tests
        run: scripts/run-sql-tests.sh
      - name: Database tests survive a run across midnight
        if: ${{ !cancelled() }}
        run: scripts/test-run-sql-tests.sh
      - name: Row count check catches lost rows
        if: ${{ !cancelled() }}
        run: scripts/test-check-row-counts.sh
      - name: Security check flags open functions
        if: ${{ !cancelled() }}
        run: python3 scripts/test-check-migration-security.py
      - name: Clash check catches a version another open pull request uses
        if: ${{ !cancelled() }}
        run: python3 scripts/test-check-migration-clashes.py
      - name: Club data export copies everything
        if: ${{ !cancelled() }}
        run: scripts/test-export-club-data.sh
      - name: First admin setup code works once, in a club with no admin
        if: ${{ !cancelled() }}
        run: scripts/test-first-admin-code.sh
      - name: Deploy script pushes new migrations every time
        if: ${{ !cancelled() }}
        run: scripts/test-deploy-migrations.sh
      - name: Test clubs stay off without TEST_CLUBS
        if: ${{ !cancelled() }}
        run: python3 scripts/test-workflow-test-clubs.py
      - name: Tests still run on every push
        if: ${{ !cancelled() }}
        run: python3 scripts/test-workflow-triggers.py
      - name: Store builds go to the Google Play closed test
        if: ${{ !cancelled() }}
        run: python3 scripts/test-store-build.py
      - name: Builds upload the app, not the guides or the git history
        if: ${{ !cancelled() }}
        run: python3 scripts/test-build-upload.py
      - name: Builds stop when the club settings are missing or wrong
        if: ${{ !cancelled() }}
        run: python3 scripts/test-check-build-settings.py
      - name: The repository stays all rights reserved
        if: ${{ !cancelled() }}
        run: python3 scripts/test-licence.py
      - name: Reset demo club puts the demo accounts back
        if: ${{ !cancelled() }}
        run: scripts/test-reset-demo-club.sh
      - name: Reset demo club signs in as a demo account
        if: ${{ !cancelled() }}
        run: scripts/test-check-demo-sign-in.sh
      - name: Reset demo club gives the club its logo
        if: ${{ !cancelled() }}
        run: scripts/test-demo-club-logo.sh
      - name: Updates keep the demo club off the live project
        if: ${{ !cancelled() }}
        run: scripts/test-publish-update.sh
      - name: Builds and updates carry the build number
        if: ${{ !cancelled() }}
        run: scripts/test-write-build-info.sh
      - name: Lockfile stays off the patched advisories
        if: ${{ !cancelled() }}
        run: python3 scripts/test-dependency-floors.py

  # The real web build driven through key flows in Chromium at phone size, with
  # Supabase answered by e2e/support/fake-supabase.ts, so a broken build or a
  # broken key flow fails here. See docs/testing-strategy.md.
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --no-audit --no-fund
      - name: Lint the smoke tests
        env:
          EXPO_OFFLINE: '1'
        run: npx expo lint e2e
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the web app
        run: npm run e2e:build
      - name: Browser smoke tests
        run: npm run e2e
      - name: Keep the browser test report
        # The HTML report, with a screenshot and trace of each failed test.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
          if-no-files-found: ignore
