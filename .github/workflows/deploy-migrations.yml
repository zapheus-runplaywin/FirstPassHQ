name: Deploy migrations

# Applies new files in supabase/migrations to the production database after
# they merge to main. Stops before anything that can lose data.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'scripts/deploy-migrations.sh', '.github/workflows/deploy-migrations.yml']
  workflow_dispatch:
    inputs:
      already_applied:
        description: 'One-time setup: versions already run by hand in the SQL editor, separated by spaces'
        type: string
        default: ''
      allow_data_loss:
        description: 'Allow data loss: apply migrations that drop or overwrite data (Matt only)'
        type: boolean
        default: false

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          # Pinned: the deploy script reads this version's dry-run output.
          version: 2.120.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: scripts/deploy-migrations.sh
        env:
          ALREADY_APPLIED: ${{ inputs.already_applied }}
          ALLOW_DATA_LOSS: ${{ inputs.allow_data_loss == true }}
