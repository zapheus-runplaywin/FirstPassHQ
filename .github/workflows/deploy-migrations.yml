name: Deploy migrations

# Applies new files in supabase/migrations after they merge to main: first to
# the test project, then to the live one only if that worked. Stops before
# anything that can lose data, unless Matt put the data-loss-approved label on
# the pull request that added it. See docs/environments.md.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'scripts/*migration*', 'scripts/check-data-loss-approval.py', '.github/workflows/deploy-migrations.yml']
  workflow_dispatch:
    inputs:
      already_applied:
        description: 'One-time setup: versions already run by hand in the SQL editor, separated by spaces'
        type: string
        default: ''
      allow_data_loss:
        description: 'Allow data loss: apply migrations that drop or overwrite data (Matt only)'
        type: boolean
        default: false
      new_live_project:
        description: 'New live project: the live database is brand new and empty, so give it every migration (Matt only)'
        type: boolean
        default: false

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

permissions:
  contents: read
  # To read who added the data-loss-approved label (scripts/check-data-loss-approval.py).
  issues: read
  pull-requests: read

jobs:
  # A run with "Allow data loss" ticked only goes ahead when Matt started it.
  # (Required reviewers on environments need a paid GitHub plan for private
  # repositories, so this checks who started the run instead.)
  approve-data-loss:
    if: ${{ inputs.allow_data_loss == true }}
    runs-on: ubuntu-24.04
    steps:
      - name: Only Matt can allow data loss
        env:
          ACTOR: ${{ github.triggering_actor }}
        run: |
          if [ "$ACTOR" != "zapheus-runplaywin" ]; then
            echo "::error::Only Matt can run this with Allow data loss ticked. This run was started by $ACTOR."
            exit 1
          fi

  # The test project goes first, so a migration that fails there never reaches
  # the live database. Until the test project's secrets are added this only
  # warns, and the live deploy goes ahead as before.
  deploy-test:
    needs: approve-data-loss
    # Runs when data loss wasn't allowed (skipped) or Matt allowed it.
    if: ${{ !cancelled() && (needs.approve-data-loss.result == 'success' || needs.approve-data-loss.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check the test project is set up
        id: test
        env:
          TEST_PROJECT_ID: ${{ secrets.SUPABASE_TEST_PROJECT_ID }}
          LIVE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$TEST_PROJECT_ID" ]; then
            echo "::warning::There is no test project yet (SUPABASE_TEST_PROJECT_ID), so only the live database is updated. See docs/environments.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$TEST_PROJECT_ID" = "$LIVE_PROJECT_ID" ]; then
            echo "::error::SUPABASE_TEST_PROJECT_ID is the live project. It must be the test project's id."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.test.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to find the pull request that added each migration
      - if: steps.test.outputs.ready == 'true'
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.121.0
      - if: steps.test.outputs.ready == 'true'
        name: Link the test project
        run: |
          if ! supabase link --project-ref "$SUPABASE_PROJECT_ID"; then
            echo "::error::Couldn't reach the test project. If it's paused, restore it in the Supabase dashboard and re-run this workflow. Nothing was applied to the live database."
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_TEST_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_TEST_PROJECT_ID }}
      - if: steps.test.outputs.ready == 'true'
        run: scripts/deploy-migrations.sh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_TEST_DB_PASSWORD }}
          # A new test project has no migrations yet, so it gets all of them.
          FIRST_RUN_OK: 'true'
          ALLOW_DATA_LOSS: ${{ inputs.allow_data_loss == true }}
          GH_TOKEN: ${{ github.token }}

  # The extra test clubs in the development setup (docs/environments.md), each
  # with its own project. They follow the test project, and the live deploy
  # doesn't wait for them, so a paused one never holds it up. Off for now: they
  # only run when the TEST_CLUBS repository variable lists them, such as [2, 3].
  deploy-test-clubs:
    needs: [approve-data-loss, deploy-test]
    if: ${{ vars.TEST_CLUBS != '' && !cancelled() && (needs.approve-data-loss.result == 'success' || needs.approve-data-loss.result == 'skipped') && needs.deploy-test.result == 'success' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The fallback is never used: without TEST_CLUBS the job is skipped.
        club: ${{ fromJSON(vars.TEST_CLUBS || '["off"]') }}
    name: deploy-test-club-${{ matrix.club }}
    steps:
      - name: Check test club ${{ matrix.club }} is set up
        id: test
        env:
          CLUB_PROJECT_ID: ${{ secrets[format('SUPABASE_TEST_{0}_PROJECT_ID', matrix.club)] }}
          CLUB_TOKEN: ${{ secrets[format('SUPABASE_TEST_{0}_ACCESS_TOKEN', matrix.club)] }}
          TEST_PROJECT_ID: ${{ secrets.SUPABASE_TEST_PROJECT_ID }}
          LIVE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$CLUB_PROJECT_ID" ]; then
            echo "There is no test club ${{ matrix.club }} (SUPABASE_TEST_${{ matrix.club }}_PROJECT_ID), so there's nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CLUB_PROJECT_ID" = "$LIVE_PROJECT_ID" ] || [ "$CLUB_PROJECT_ID" = "$TEST_PROJECT_ID" ]; then
            echo "::error::SUPABASE_TEST_${{ matrix.club }}_PROJECT_ID is another club's project. It must be test club ${{ matrix.club }}'s own."
            exit 1
          fi
          if [ -z "$CLUB_TOKEN" ]; then
            echo "::error::SUPABASE_TEST_${{ matrix.club }}_ACCESS_TOKEN is missing. See docs/environments.md."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.test.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to find the pull request that added each migration
      - if: steps.test.outputs.ready == 'true'
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.121.0
      - if: steps.test.outputs.ready == 'true'
        name: Link test club ${{ matrix.club }}
        run: |
          if ! supabase link --project-ref "$SUPABASE_PROJECT_ID"; then
            echo "::error::Couldn't reach test club ${{ matrix.club }}'s project. If it's paused, restore it in the Supabase dashboard and re-run this job. The live database isn't affected."
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets[format('SUPABASE_TEST_{0}_ACCESS_TOKEN', matrix.club)] }}
          SUPABASE_DB_PASSWORD: ${{ secrets[format('SUPABASE_TEST_{0}_DB_PASSWORD', matrix.club)] }}
          SUPABASE_PROJECT_ID: ${{ secrets[format('SUPABASE_TEST_{0}_PROJECT_ID', matrix.club)] }}
      - if: steps.test.outputs.ready == 'true'
        run: scripts/deploy-migrations.sh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets[format('SUPABASE_TEST_{0}_ACCESS_TOKEN', matrix.club)] }}
          SUPABASE_DB_PASSWORD: ${{ secrets[format('SUPABASE_TEST_{0}_DB_PASSWORD', matrix.club)] }}
          # A new project has no migrations yet, so it gets all of them.
          FIRST_RUN_OK: 'true'
          ALLOW_DATA_LOSS: ${{ inputs.allow_data_loss == true }}
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: [approve-data-loss, deploy-test]
    # Runs when data loss wasn't allowed (skipped) or Matt allowed it, and the
    # test project took the migrations.
    if: ${{ !cancelled() && (needs.approve-data-loss.result == 'success' || needs.approve-data-loss.result == 'skipped') && needs.deploy-test.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Only Matt can mark a new live project
        if: ${{ inputs.new_live_project == true }}
        env:
          ACTOR: ${{ github.triggering_actor }}
        run: |
          if [ "$ACTOR" != "zapheus-runplaywin" ]; then
            echo "::error::Only Matt can run this with New live project ticked. This run was started by $ACTOR."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to find the pull request that added each migration
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          # Pinned: the deploy script reads this version's dry-run output. Keep it on the newest release (AGENTS.md).
          version: 2.121.0
      # Secrets go only to the steps that use them.
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      - run: scripts/deploy-migrations.sh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          ALREADY_APPLIED: ${{ inputs.already_applied }}
          # Only when Matt ticks New live project, for a replacement live
          # project. The script still refuses unless Supabase has no record of
          # any migration there.
          FIRST_RUN_OK: ${{ inputs.new_live_project == true }}
          ALLOW_DATA_LOSS: ${{ inputs.allow_data_loss == true }}
          GH_TOKEN: ${{ github.token }}
