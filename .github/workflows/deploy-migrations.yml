name: Deploy migrations

# Applies new files in supabase/migrations to the production database after
# they merge to main. Stops before anything that can lose data.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'scripts/*migration*', '.github/workflows/deploy-migrations.yml']
  workflow_dispatch:
    inputs:
      already_applied:
        description: 'One-time setup: versions already run by hand in the SQL editor, separated by spaces'
        type: string
        default: ''
      allow_data_loss:
        description: 'Allow data loss: apply migrations that drop or overwrite data (Matt only)'
        type: boolean
        default: false

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A run with "Allow data loss" ticked waits here until it is approved. Add
  # Matt as the required reviewer of the data-loss environment in GitHub >
  # Settings > Environments so only he can approve it.
  approve-data-loss:
    if: ${{ inputs.allow_data_loss == true }}
    runs-on: ubuntu-latest
    environment: data-loss
    steps:
      - run: echo "Data loss approved for this run."

  deploy:
    needs: approve-data-loss
    # Runs when no approval was needed (skipped) or it was given.
    if: ${{ !cancelled() && (needs.approve-data-loss.result == 'success' || needs.approve-data-loss.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          # Pinned: the deploy script reads this version's dry-run output.
          version: 2.120.0
      # Secrets go only to the steps that use them.
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      - run: scripts/deploy-migrations.sh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          ALREADY_APPLIED: ${{ inputs.already_applied }}
          ALLOW_DATA_LOSS: ${{ inputs.allow_data_loss == true }}
