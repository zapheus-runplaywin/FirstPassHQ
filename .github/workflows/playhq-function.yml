name: Deploy PlayHQ function

# Deploys the playhq function, which reads PlayHQ competitions for admins
# importing fixtures, when it changes.
on:
  push:
    branches: [main]
    paths: ['supabase/functions/playhq/**', '.github/workflows/playhq-function.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      # JWT check on: only signed-in members reach it, and it checks they're an admin.
      - run: >
          supabase functions deploy playhq
          --project-ref "$SUPABASE_PROJECT_ID" --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

  # The same function in the test project, when there is one (see
  # docs/environments.md).
  deploy-test:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check the test project is set up
        id: test
        env:
          TEST_PROJECT_ID: ${{ secrets.SUPABASE_TEST_PROJECT_ID }}
        run: echo "ready=$([ -n "$TEST_PROJECT_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.test.outputs.ready == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - if: steps.test.outputs.ready == 'true'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - if: steps.test.outputs.ready == 'true'
        run: >
          supabase functions deploy playhq
          --project-ref "$SUPABASE_PROJECT_ID" --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_TEST_PROJECT_ID }}
