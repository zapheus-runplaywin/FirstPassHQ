name: Beta build

# Starts the app builds for beta testers on Expo's build servers (EAS), so no
# computer with Xcode or Android Studio is needed. Run it by hand from Actions.
#
# - Android, one of:
#   - link: an installable APK (the preview profile). Testers open the link on
#     the build page to install it.
#   - play-closed-test: a store bundle (.aab, the production profile) sent to
#     Google Play's closed testing track as a draft release, which you roll out
#     in Play Console.
#   - play-closed-test-rollout: the same, rolled out to testers straight away.
#     Only works once a closed-test release has been rolled out by hand.
# - iOS: a store build (the production profile) sent on to TestFlight.
#
# Builds use the live Supabase project, from the EAS environment named after
# the profile. Each build counts towards the Expo plan's monthly builds, so
# this never runs on its own. See docs/beta-builds.md for the one-time setup.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which app to build'
        type: choice
        options: [android, ios, both]
        default: android
      android_build:
        description: 'Android only: an install link, or a store bundle sent to the Google Play closed test'
        type: choice
        options: [link, play-closed-test, play-closed-test-rollout]
        default: link
      # No "What to test" box: EAS only accepts that TestFlight text
      # on Expo's Enterprise plan and refuses the TestFlight submission
      # otherwise (Beta build run 5, 20 Nov 2026). Type it in App Store
      # Connect > TestFlight instead (docs/store/review-notes.md).

concurrency:
  group: beta-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        # Explicit, so a failed build fails the step even when piped to tee.
        shell: bash
    steps:
      - name: Check the Expo token is set up
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret first. See docs/beta-builds.md."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the build number below matches the build-N tag.
          fetch-depth: 0
      # Puts "Build N" on the app's opening screen, Find your club, sign-in and
      # home (docs/beta-builds.md, "Which build is this?"). Expo's servers get
      # no git history, so it's worked out here and uploaded with the build.
      - name: Write the build number into the app
        run: node scripts/write-build-info.js
      # EAS reads the app config, which needs the config plugins installed.
      - run: npm ci --no-audit --no-fund
      # --no-wait: the build runs on Expo's servers, so this job finishes as
      # soon as it has started and doesn't use up Actions minutes waiting.
      - name: Build for Android
        if: inputs.platform != 'ios'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_BUILD: ${{ inputs.android_build }}
        run: |
          case "$ANDROID_BUILD" in
            link) args=(--profile preview) ;;
            play-closed-test) args=(--profile production --auto-submit-with-profile production) ;;
            play-closed-test-rollout) args=(--profile production --auto-submit-with-profile closed-test-rollout) ;;
            *) echo "::error::Unknown Android build: $ANDROID_BUILD"; exit 1 ;;
          esac
          npx --yes eas-cli@24.12.0 build --platform android "${args[@]}" \
            --non-interactive --no-wait | tee android.log
      - name: Build for iOS and send it to TestFlight
        if: inputs.platform != 'android'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@24.12.0 build --platform ios --profile production --auto-submit \
            --non-interactive --no-wait | tee ios.log
      - name: Links to the builds
        if: always()
        run: |
          {
            echo "### Builds started on Expo's servers"
            echo
            { cat android.log ios.log 2>/dev/null || true; } | { grep -oE 'https://expo\.dev/[^ ]+' || true; } | sort -u | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
