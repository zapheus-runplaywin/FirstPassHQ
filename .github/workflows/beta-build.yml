name: Beta build

# Starts the app builds for beta testers on Expo's build servers (EAS), so no
# computer with Xcode or Android Studio is needed. Run it by hand from Actions.
#
# - Android: an installable APK (the preview profile). Testers open the link
#   on the build page to install it.
# - iOS: a store build (the production profile) sent on to TestFlight.
#
# Builds use the live Supabase project, from the EAS environment named after
# the profile. Each build counts towards the Expo plan's monthly builds, so
# this never runs on its own. See docs/beta-builds.md for the one-time setup.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which app to build'
        type: choice
        options: [android, ios, both]
        default: android
      what_to_test:
        description: 'iOS only: what testers should try, shown in TestFlight (optional)'
        type: string
        default: ''

concurrency:
  group: beta-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        # Explicit, so a failed build fails the step even when piped to tee.
        shell: bash
    steps:
      - name: Check the Expo token is set up
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret first. See docs/beta-builds.md."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # EAS reads the app config, which needs the config plugins installed.
      - run: npm ci --no-audit --no-fund
      # --no-wait: the build runs on Expo's servers, so this job finishes as
      # soon as it has started and doesn't use up Actions minutes waiting.
      - name: Build for Android
        if: inputs.platform != 'ios'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@24.12.0 build --platform android --profile preview \
            --non-interactive --no-wait | tee android.log
      - name: Build for iOS and send it to TestFlight
        if: inputs.platform != 'android'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          WHAT_TO_TEST: ${{ inputs.what_to_test }}
        run: |
          args=(--platform ios --profile production --auto-submit --non-interactive --no-wait)
          if [ -n "$WHAT_TO_TEST" ]; then args+=(--what-to-test "$WHAT_TO_TEST"); fi
          npx --yes eas-cli@24.12.0 build "${args[@]}" | tee ios.log
      - name: Links to the builds
        if: always()
        run: |
          {
            echo "### Builds started on Expo's servers"
            echo
            { cat android.log ios.log 2>/dev/null || true; } | { grep -oE 'https://expo\.dev/[^ ]+' || true; } | sort -u | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
