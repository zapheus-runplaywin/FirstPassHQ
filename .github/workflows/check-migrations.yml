name: Check migrations

# Runs on pull requests that add migrations: merged migrations stay unchanged,
# nothing loses data without the data-loss-approved label, and every
# migration applies cleanly to a fresh Supabase database. New migrations must
# also pass the security check, which has no label to skip it.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths: ['supabase/migrations/**', 'scripts/*migration*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Merged migrations are not edited
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          changed=$(git diff --name-status --diff-filter=MDR "$BASE"...HEAD -- supabase/migrations)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::Merged migrations must not change. Add a new migration instead."
            exit 1
          fi
      # Supabase records migrations by the number before the first "_", so two
      # files with the same number stop every deploy after them.
      # The checks below run even when an earlier one fails, so one run shows
      # every problem.
      - name: Every migration has its own version number
        if: ${{ !cancelled() }}
        run: |
          dupes=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dupes" ]; then
            for v in $dupes; do ls supabase/migrations/${v}_*.sql; done
            echo "::error::Two migrations share a version number. Give the newer one a later, unused number."
            exit 1
          fi
      - name: Nothing exposes data
        if: ${{ !cancelled() }}
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          files=$(git diff --name-only --diff-filter=A "$BASE"...HEAD -- 'supabase/migrations/*.sql')
          if [ -n "$files" ]; then python3 scripts/check-migration-security.py $files; fi
      - name: Nothing loses data without permission
        if: ${{ !cancelled() && !contains(github.event.pull_request.labels.*.name, 'data-loss-approved') }}
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          files=$(git diff --name-only --diff-filter=A "$BASE"...HEAD -- 'supabase/migrations/*.sql')
          if [ -n "$files" ]; then python3 scripts/check-migrations.py $files; fi
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: ${{ !cancelled() }}
        with:
          version: latest
      - name: Migrations apply to a fresh database
        if: ${{ !cancelled() }}
        run: |
          supabase init
          supabase db start
