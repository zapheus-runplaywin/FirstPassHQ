name: Mutation tests

# Tests the tests: Stryker (stryker.config.json) makes small changes to the
# child-safety and access rules in src/lib, such as turning a < into a <= or
# a role name into "", and runs the unit tests against each one. A change no
# test notices is a gap in the tests. Fails when the mutation score drops
# below the floor in stryker.config.json (thresholds.break).
#
# Run by hand only, to save Actions minutes. Runs are incremental: Stryker's
# results are kept in the Actions cache, so only the first run is long (about two
# hours for 1,168 changes, 28 November 2026), and later runs only test again
# what changed since.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-24.04
    # A full first run was stopped at 90 minutes with 72% done (28 November 2026).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --no-audit --no-fund
      # The newest results from an earlier run on this branch, or on main.
      - name: Restore the last run's results
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: stryker-incremental-
      - name: Mutation tests
        run: npm run test:mutation
      # Saved even when the score is below the floor, so the next run is quick.
      - name: Keep this run's results
        if: ${{ !cancelled() && hashFiles('reports/stryker-incremental.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}
      - name: Keep the mutation report
        # Each surviving change, with the line it changed and the tests that ran.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 30
          if-no-files-found: ignore
