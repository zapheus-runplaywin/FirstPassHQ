name: Reset demo club

# Puts the DEMO club's sample people back on the TEST Supabase project
# (supabase/demo-club.sql): the 20 demo accounts with the shared password from
# the DEMO_PASSWORD secret, their roles, squads, teams and guardian links, and
# the 20 & Under pilot. Then it signs in once as admin@ through the test
# project's Auth API (scripts/check-demo-sign-in.sh), so a reset proves a demo
# account really signs in. Run it after setting DEMO_PASSWORD, after each review
# round or test pass, or when a reviewer has deleted an account. See
# docs/environments.md, "The demo club".
#
# By hand only: it never runs on its own. It only ever reads the test
# project's secrets, refuses when they name the live project, and the script
# itself runs only where test-data.sql's sample people are.
on:
  workflow_dispatch:

concurrency:
  group: reset-demo-club
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_TEST_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_TEST_PROJECT_ID }}
      LIVE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
    steps:
      - name: Check the secrets
        run: |
          if [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::There is no test project id or database password in the repository secrets. See docs/environments.md."
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_ID" = "$LIVE_PROJECT_ID" ]; then
            echo "::error::The test project id is the live project's. The demo club only ever goes on the test project."
            exit 1
          fi
          if [ ${#DEMO_PASSWORD} -lt 12 ]; then
            echo "::error::Add a DEMO_PASSWORD repository secret of at least 12 characters first. See docs/environments.md."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      - name: Link the test project
        run: |
          if ! supabase link --project-ref "$SUPABASE_PROJECT_ID"; then
            echo "::error::Couldn't reach the test project. If it's paused, restore it in the Supabase dashboard and run this again."
            exit 1
          fi
      - name: Reset the demo club
        run: |
          # supabase link saves the project's connection pooler address. Use
          # its session mode (port 5432) so the script's settings stay with it.
          url=$(sed -E 's/:6543\//:5432\//' supabase/.temp/pooler-url)
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql -X -q -v ON_ERROR_STOP=1 \
            -v demo_password="$DEMO_PASSWORD" -f supabase/demo-club.sql "$url"
      - name: Sign in as a demo account
        run: scripts/check-demo-sign-in.sh
